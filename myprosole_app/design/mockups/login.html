<!--
  Mockup: Anmelden — Android, Material 3
  Verwendet ausschließlich Tokens/Komponenten aus ../design-system/.
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#16213E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyProSole">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>MyProSole – Anmelden</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../scripts/prototype-theme.js"></script>
</head>
<body class="md-screen">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
</svg>

<div class="device-frame">

  <div class="md-app-bar">
    <a class="md-app-bar__icon-btn" href="welcome.html" aria-label="Zurück"><svg class="icon"><use href="#icon-back"/></svg></a>
  </div>

  <form class="md-auth-form" action="home.html" method="get" data-profile-complete>

    <div>
      <p class="md-greeting__title" style="font: var(--type-title-lg); margin:0 0 4px;">Willkommen zurück</p>
      <p class="md-greeting__subtitle">Melde dich an, um deinen Fortschritt zu sehen.</p>
    </div>

    <div class="md-field">
      <label class="md-field__label" for="login-email">E-Mail</label>
      <input class="md-field__input" id="login-email" type="email" placeholder="name@beispiel.de" autocomplete="email" required>
    </div>

    <div class="md-field">
      <label class="md-field__label" for="login-password">Passwort</label>
      <input class="md-field__input" id="login-password" type="password" placeholder="Dein Passwort" autocomplete="current-password" minlength="8" required>
    </div>

    <a href="#" style="text-decoration:none; color: var(--md-on-surface-variant); font: var(--type-body-md); margin-top:-8px;">Passwort vergessen?</a>

    <button class="md-button md-button--filled" type="submit">Anmelden</button>

    <p class="md-auth-link">Noch kein Konto? <a href="register.html">Registrieren</a></p>

  </form>

</div>

<script src="../scripts/prototype-profile-state.js"></script>
<script src="../scripts/prototype-app-shell.js"></script>
<script src="../scripts/prototype-placeholder.js"></script>
<script src="../scripts/supabase-init.js"></script>

</body>
</html>
