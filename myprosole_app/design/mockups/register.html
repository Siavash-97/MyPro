<!--
  Mockup: Registrieren — Android, Material 3
  Verwendet ausschließlich Tokens/Komponenten aus ../design-system/.
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyProSole – Registrieren</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
</head>
<body class="md-screen">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.17 5.53 12.7l-1.41 1.41L9 19 20.29 7.71l-1.41-1.41z"/></symbol>
</svg>

<div class="device-frame">

  <div class="md-app-bar">
    <a class="md-app-bar__icon-btn" href="welcome.html" aria-label="Zurück"><svg class="icon"><use href="#icon-back"/></svg></a>
  </div>

  <div style="padding: 0 var(--space-lg) var(--space-lg); display:flex; flex-direction:column; gap: var(--space-lg);">

    <div>
      <p class="md-greeting__title" style="font: var(--type-title-lg); margin:0 0 4px;">Konto erstellen</p>
      <p class="md-greeting__subtitle">Starte mit deiner ersten Laufanalyse.</p>
    </div>

    <div class="md-field">
      <label class="md-field__label">Name</label>
      <input class="md-field__input" type="text" placeholder="Vor- und Nachname">
    </div>

    <div class="md-field">
      <label class="md-field__label">E-Mail</label>
      <input class="md-field__input" type="email" placeholder="name@beispiel.de">
    </div>

    <div class="md-field">
      <label class="md-field__label">Passwort</label>
      <input class="md-field__input" type="password" placeholder="Mindestens 8 Zeichen">
    </div>

    <div class="md-checkbox-row">
      <div class="md-checkbox md-checkbox--checked"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#icon-check"/></svg></div>
      <p class="md-checkbox-row__label">Ich akzeptiere die <a href="#">AGB</a> und die <a href="#">Datenschutzerklärung</a>.</p>
    </div>

    <a class="md-button md-button--filled" href="home.html" style="width:100%; text-decoration:none;">Registrieren</a>

    <p class="md-auth-link">Schon ein Konto? <a href="login.html">Anmelden</a></p>

  </div>

</div>

</body>
</html>
