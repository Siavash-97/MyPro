<!--
  Mockup: E-Mail-Bestätigung — Android, Material 3
  Zeigt nach der Registrierung die Code-Eingabe an.
  Verarbeitet auch den Bestätigungslink aus der E-Mail (token_hash + type in URL).
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#16213E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyProSole">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>MyProSole – E-Mail bestätigen</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../scripts/prototype-theme.js"></script>
<style>
.confirm-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 16px;
  background: var(--md-primary-container);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.confirm-icon svg {
  width: 32px;
  height: 32px;
  fill: var(--md-on-primary-container);
}
.otp-inputs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 16px 0;
}
.otp-inputs input {
  width: 48px;
  height: 56px;
  text-align: center;
  font: var(--type-headline-md);
  font-family: monospace;
  border: 2px solid var(--md-outline);
  border-radius: 12px;
  background: var(--md-surface);
  color: var(--md-on-surface);
  outline: none;
  transition: border-color 0.15s;
}
.otp-inputs input:focus {
  border-color: var(--md-primary);
}
.otp-inputs input.filled {
  border-color: var(--md-primary);
  background: var(--md-primary-container);
}
.confirm-email-hint {
  font: var(--type-body-md);
  color: var(--md-on-surface-variant);
  text-align: center;
  margin: 0;
}
.confirm-email-addr {
  font-weight: 600;
  color: var(--md-on-surface);
}
.resend-link {
  font: var(--type-body-md);
  color: var(--md-primary);
  text-decoration: none;
  text-align: center;
  display: block;
  margin-top: 8px;
  cursor: pointer;
}
.resend-link[disabled] {
  color: var(--md-on-surface-variant);
  pointer-events: none;
}
.confirm-success {
  display: none;
  text-align: center;
}
.confirm-success svg {
  width: 48px;
  height: 48px;
  fill: var(--md-primary);
  margin-bottom: 8px;
}
</style>
</head>
<body class="md-screen">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
  <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></symbol>
  <symbol id="icon-check-circle" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></symbol>
</svg>

<div class="device-frame">

  <div class="md-app-bar">
    <a class="md-app-bar__icon-btn" href="register.html" aria-label="Zurück"><svg class="icon"><use href="#icon-back"/></svg></a>
    <span class="md-app-bar__title">E-Mail bestätigen</span>
  </div>

  <!-- Code-Eingabe Formular -->
  <form class="md-auth-form" id="confirm-form" style="text-align:center;">

    <div class="confirm-icon">
      <svg><use href="#icon-mail"/></svg>
    </div>

    <div>
      <p class="md-greeting__title" style="font: var(--type-title-lg); margin:0 0 4px;">Prüfe dein Postfach</p>
      <p class="confirm-email-hint">
        Wir haben einen Bestätigungscode an<br>
        <span class="confirm-email-addr" id="confirm-email-display">deine E-Mail</span><br>
        gesendet.
      </p>
    </div>

    <div class="otp-inputs" id="otp-inputs">
      <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="one-time-code" aria-label="Ziffer 1" required>
      <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Ziffer 2" required>
      <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Ziffer 3" required>
      <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Ziffer 4" required>
      <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Ziffer 5" required>
      <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Ziffer 6" required>
    </div>

    <button class="md-button md-button--filled" type="submit" id="confirm-btn">Bestätigen</button>

    <a class="resend-link" id="resend-link">Code erneut senden</a>

  </form>

  <!-- Erfolgs-Ansicht -->
  <div class="md-auth-form confirm-success" id="confirm-success">
    <svg><use href="#icon-check-circle"/></svg>
    <p class="md-greeting__title" style="font: var(--type-title-lg); margin:0 0 4px;">E-Mail bestätigt!</p>
    <p class="confirm-email-hint">Dein Konto ist aktiv. Du wirst gleich weitergeleitet.</p>
  </div>

</div>

<script src="../scripts/prototype-app-shell.js"></script>
<script src="../scripts/supabase-init.js"></script>
<script src="../scripts/supabase-confirm.js"></script>

</body>
</html>
