<!--
  Mockup: Community — Neuer Beitrag — Android, Material 3
  Composer für Feed-Beiträge. Fotos/Läufe anhängen führt bewusst ins
  bestehende Social-Studio statt eine zweite Bildauswahl zu bauen.
  Verwendet ausschließlich Tokens/Komponenten aus ../design-system/.
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#16213E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyProSole">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>MyProSole – Neuer Beitrag</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../scripts/prototype-theme.js"></script>
</head>
<body class="md-screen">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
  <symbol id="icon-photo" viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5z"/></symbol>
  <symbol id="icon-profile" viewBox="0 0 24 24"><path d="M12 12c2.7 0 8 1.34 8 4v2H4v-2c0-2.66 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></symbol>
  <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5z"/></symbol>
</svg>

<div class="device-frame">

  <div class="md-app-bar">
    <a class="md-app-bar__icon-btn" href="community.html" aria-label="Zurück"><svg class="icon"><use href="#icon-back"/></svg></a>
    <span class="md-app-bar__title">Neuer Beitrag</span>
  </div>

  <main class="md-page-stack">

    <div class="md-row" style="justify-content:flex-start; gap: var(--space-sm);">
      <div class="md-avatar md-avatar--sm" aria-hidden="true"><svg class="icon-sm"><use href="#icon-profile"/></svg></div>
      <p style="margin:0; font: var(--type-label-lg); color: var(--md-on-surface);">Du postest als Sia</p>
    </div>

    <textarea class="md-field__input" rows="5" style="height:auto; padding: var(--space-md); resize:none;" placeholder="Frage stellen, Tipp suchen oder deinen letzten Lauf beschreiben&hellip;" disabled></textarea>

    <a class="md-card md-row" href="social-studio.html" style="text-decoration:none; color:inherit;">
      <div class="md-row" style="gap: var(--space-sm); justify-content:flex-start;">
        <svg class="icon" style="color: var(--md-on-surface-variant);"><use href="#icon-photo"/></svg>
        <span style="font: var(--type-body-lg);">Foto oder letzten Lauf anhängen</span>
      </div>
    </a>

    <div class="md-info-note md-info-note--neutral">
      <svg class="icon-sm"><use href="#icon-shield"/></svg>
      <p>Dein Beitrag ist für alle MyProSole-Läufer:innen sichtbar. Verletzungen, Schmerzangaben und andere Gesundheitsdaten bleiben in deinem privaten Verlauf – die teilst du hier nicht.</p>
    </div>

    <button class="md-button md-button--filled" style="width:100%;" disabled>Veröffentlichen</button>

  </main>

</div>

<script src="../scripts/prototype-app-shell.js"></script>
<script src="../scripts/prototype-placeholder.js"></script>

</body>
</html>
