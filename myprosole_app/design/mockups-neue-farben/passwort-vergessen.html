<!--
  Mockup: Passwort vergessen — Android, Material 3
  Live-Route auf my-pro-n38r.vercel.app: /passwort-vergessen.
  Verwendet ausschließlich Tokens/Komponenten aus ../design-system/.
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#16213E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyProSole">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>MyProSole – Passwort vergessen</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script>try{sessionStorage.setItem("myprosole.prototype.theme","light");sessionStorage.setItem("myprosole.prototype.palette","setb");}catch(e){}</script>
<script src="../scripts/prototype-theme.js"></script>
</head>
<body class="md-screen">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
</svg>

<div class="device-frame">

  <div class="md-app-bar">
    <a class="md-app-bar__icon-btn" href="login.html" aria-label="Zurück"><svg class="icon"><use href="#icon-back"/></svg></a>
  </div>

  <form class="md-auth-form" data-auth>

    <div>
      <p class="md-greeting__title" style="font: var(--type-title-lg); margin:0 0 4px;">Passwort vergessen</p>
      <p class="md-greeting__subtitle">Gib deine E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen.</p>
    </div>

    <div class="md-field">
      <label class="md-field__label" for="reset-email">E-Mail</label>
      <input class="md-field__input" id="reset-email" type="email" placeholder="name@beispiel.de" autocomplete="email" required>
    </div>

    <button class="md-button md-button--filled" type="submit">Link senden</button>

    <p class="md-auth-link"><a href="login.html">Zurück zur Anmeldung</a></p>

  </form>

</div>

<script src="../scripts/prototype-app-shell.js"></script>
<script src="../scripts/prototype-placeholder.js"></script>
</body>
</html>
