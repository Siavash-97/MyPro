name: Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-standards:
    name: Verbindliche Entwicklungsstandards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_development_standards.py

  project-planner:
    name: Projektplaner · Unit + Browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-planner/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:automated
      - name: Playwright-Bericht speichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: project-planner/playwright-report/
          retention-days: 7

  myprosole-analysis:
    name: MyProSole · Unit + Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myprosole_app
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: myprosole_app/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python test_gait_integration.py
      - run: python test_shared_upload.py
